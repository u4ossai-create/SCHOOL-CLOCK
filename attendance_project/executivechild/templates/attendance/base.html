{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E3A8A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="{% static 'attendance/icon-192.png' %}">
  <link rel="apple-touch-icon" href="{% static 'attendance/icon-192.png' %}">
  <title>{% block title %}Executive Child Intl Sch{% endblock %}</title>
  <style>
    :root {
      --primary-blue: #1E3A8A;
      --secondary-blue: #3B82F6;
      --dark-blue: #1E40AF;
      --bg-color: #1E3A8A;
      --card-bg: #FFFFFF;
      --text-dark: #1F2937;
      --text-light: #6B7280;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    /* LOCK THE BODY TO THE EXACT SCREEN HEIGHT */
    html, body {
      margin: 0; 
      height: 100dvh; 
      overflow: hidden; /* Prevents scrolling */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-dark);
      display: flex; justify-content: center;
      padding: 8px;
    }

    .card {
      width: 100%; 
      max-width: 480px;
      height: 100%; /* Fills the available height */
      background: var(--card-bg);
      border-radius: 16px;
      padding: 12px 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column; /* Stacks items vertically */
    }

    .brand { text-align: center; margin-bottom: 6px; }
    .brand img { max-height: 45px; width: auto; }
    
    h1 { font-size: 1.1rem; margin: 0 0 2px; color: var(--primary-blue); text-align: center; font-weight: 800; }
    .muted { color: var(--text-dark); font-size: .8rem; margin: 0 0 10px; text-align: center; font-weight: 500; }
    
    /* Step 1: Input */
    .input-group { margin-bottom: 10px; }
    .input-group label { display: block; font-size: .75rem; font-weight: 700; color: var(--primary-blue); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    .input-group input {
      width: 100%; padding: 10px 12px; border-radius: 8px;
      border: 2px solid #93C5FD; font-size: 1rem;
      font-weight: 600; color: var(--text-dark);
      transition: all 0.2s;
      background-color: #F8FAFC;
    }
    .input-group input:focus {
      outline: none; border-color: var(--secondary-blue);
      background-color: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    /* Step 2: Camera - Takes up remaining space */
    .stage {
      position: relative; 
      flex: 1; /* This shrinks to fit the screen! */
      min-height: 100px; 
      width: 100%;
      background: #E5E7EB; border-radius: 12px; overflow: hidden;
      border: 2px solid #BFDBFE; margin-bottom: 10px;
      display: flex; align-items: center; justify-content: center;
    }
    .stage video, .stage img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .stage .placeholder { color: var(--text-light); font-weight: 600; font-size: .85rem; }
    
    /* Buttons */
    .file-wrap { display: block; margin-bottom: 8px; }
    .file-wrap input { display: none; }
    
    button, .file-wrap span {
      display: block; width: 100%; padding: 12px; border-radius: 8px;
      border: none; font-size: 1rem; font-weight: 800; text-align: center;
      cursor: pointer; font-family: inherit; transition: transform 0.1s;
      letter-spacing: 0.5px;
    }
    button:active, .file-wrap span:active { transform: scale(0.98); }
    
    .btn-camera { background-color: var(--primary-blue); color: #fff; }
    .btn-in { background-color: var(--secondary-blue); color: #fff; }
    .btn-out { background-color: var(--dark-blue); color: #fff; }
    .btn-retake { background-color: #E5E7EB; color: var(--text-dark); margin-bottom: 8px; padding: 8px; font-size: 0.9rem; }
    
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    
    .actions { display: grid; gap: 8px; margin-top: 6px; }
    .status { font-size: .8rem; font-weight: 700; text-align: center; margin-top: 8px; min-height: 1.2em; color: var(--primary-blue); }
    .error { color: #DC2626; font-size: .8rem; font-weight: 700; text-align: center; margin-top: 8px; }
    
    .foot { margin-top: 8px; text-align: center; font-size: .65rem; color: var(--text-light); font-weight: 600; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <img src="{% static 'attendance/logo.png' %}" alt="Executive Child Intl Sch Logo">
    </div>
    {% block content %}{% endblock %}
    <div class="foot">Powered by Executive Child Intl Sch</div>
  </main>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(function () {});
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
