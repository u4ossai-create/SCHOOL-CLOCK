{% extends "attendance/base.html" %}
{% block title %}Clock In/Out{% endblock %}

{% block content %}
  <h1>Welcome</h1>
  <h1>Executive Child Intl Sch</h1>
  <p class="muted">Please clock in or clock out.</p>

  <!-- STEP 1: Surname / Staff ID -->
  <div class="input-group">
    <label for="query">Step 1: Enter Surname or Staff ID</label>
    <input id="query" name="query" autocomplete="off" placeholder="e.g. A10021">
  </div>

  <!-- STEP 2: Photo Capture -->
  <label style="display:block; font-size:.75rem; font-weight:700; color:#1E3A8A; margin-bottom:4px; text-transform:uppercase; letter-spacing:0.5px;">
    Step 2: Capture Photo
  </label>
  
  <div class="stage">
    <video id="video" playsinline autoplay muted webkit-playsinline style="display:none"></video>
    <canvas id="canvas" hidden></canvas>
    <img id="preview" alt="" style="display:none">
    <div class="placeholder" id="placeholder">Camera ready</div>
  </div>

  <label class="file-wrap" id="fileWrap">
    <input id="file" type="file" accept="image/*" capture="user">
    <span class="btn-camera">📷 Take Photo</span>
  </label>

  <div class="actions" id="photoActions" style="display:none">
    <button id="btnRetake" type="button" class="btn-retake">Retake Photo</button>
  </div>

  <!-- STEP 3: Submit -->
  <label style="display:block; font-size:.75rem; font-weight:700; color:#1E3A8A; margin-top:8px; margin-bottom:4px; text-transform:uppercase; letter-spacing:0.5px;">
    Step 3: Record Time
  </label>
  
  <div class="actions">
    <button id="btnIn" type="button" class="btn-in" disabled>CLOCK IN</button>
    <button id="btnOut" type="button" class="btn-out" disabled>CLOCK OUT</button>
  </div>

  <p class="status" id="status">Waiting for input...</p>
  <p class="error" id="error" style="display:none"></p>
{% endblock %}

{% block scripts %}
<script>
(function () {
  "use strict";
  var CFG = {
    url: "{% url 'executivechild:mark' %}",
    csrf: "{{ csrf_token }}",
    secure: window.isSecureContext === true,
    gum: !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)
  };
  function $(id){ return document.getElementById(id); }

  var video=$("video"), canvas=$("canvas"), preview=$("preview"), placeholder=$("placeholder");
  var statusEl=$("status"), errorEl=$("error");
  var fileWrap=$("fileWrap"), fileInput=$("file");
  var photoActions=$("photoActions"), btnRetake=$("btnRetake");
  var queryEl=$("query"), btnIn=$("btnIn"), btnOut=$("btnOut");

  var stream=null, blob=null;

  function newUuid(){
    try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch(e){}
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,function(c){
      var r=(Math.random()*16)|0; return (c==="x"?r:(r&0x3)|0x8).toString(16);
    });
  }
  function deviceId(){
    var id=null; try{ id=localStorage.getItem("attendance.device_id"); }catch(e){}
    if(!id){ id=newUuid(); try{ localStorage.setItem("attendance.device_id", id); }catch(e){} }
    return id;
  }

  function checkFormStatus() {
    var hasPhoto = !!blob;
    var hasQuery = queryEl.value.trim().length > 0;
    
    if (hasPhoto && hasQuery) {
      btnIn.disabled = false;
      btnOut.disabled = false;
      statusEl.textContent = "Ready. Tap Clock In or Clock Out.";
      statusEl.style.color = "#1E3A8A";
    } else {
      btnIn.disabled = true;
      btnOut.disabled = true;
      if (!hasQuery) statusEl.textContent = "";
      else if (!hasPhoto) statusEl.textContent = "Please capture a photo.";
    }
  }

  function showPreview(src){
    placeholder.style.display="none";
    video.style.display="none";
    preview.src=src;
    preview.style.display="block";
    photoActions.style.display="block";
    fileWrap.style.display="none";
    checkFormStatus();
  }

  function resetPhoto(){
    blob=null;
    preview.removeAttribute("src");
    preview.style.display="none";
    video.style.display="none";
    placeholder.style.display="block";
    photoActions.style.display="none";
    fileWrap.style.display="block";
    fileInput.value="";
    var cap=document.getElementById("btnCapture");
    if(cap) cap.remove();
    checkFormStatus();
  }

  function tryLive(){
    if(!CFG.secure || !CFG.gum) return;
    navigator.mediaDevices.getUserMedia({
      video:{ facingMode:"user", width:{ideal:1280}, height:{ideal:720} }, audio:false
    }).then(function(s){
      stream=s; video.srcObject=s;
      video.style.display="block";
      placeholder.style.display="none";
      fileWrap.style.display="none";
      var cap=document.createElement("button");
      cap.type="button"; cap.textContent="Take Photo"; cap.id="btnCapture";
      cap.className="btn-camera"; cap.style.marginBottom="8px";
      photoActions.parentNode.insertBefore(cap, photoActions);
      photoActions.style.display="block";
      cap.addEventListener("click", function(){
        var vw=video.videoWidth, vh=video.videoHeight;
        if(!vw||!vh) return;
        var side=Math.min(vw,vh), out=Math.min(640,side);
        canvas.width=out; canvas.height=out;
        canvas.getContext("2d").drawImage(video,(vw-side)/2,(vh-side)/2,side,side,0,0,out,out);
        canvas.toBlob(function(b){ blob=b; cap.remove(); showPreview(canvas.toDataURL("image/jpeg",0.85)); },"image/jpeg",0.85);
      });
      statusEl.textContent = "Look at the camera and tap Take Photo.";
    }).catch(function(){ /* keep file input */ });
  }

  fileInput.addEventListener("change", function(e){
    var f=e.target.files && e.target.files[0];
    if(!f) return;
    blob=f; showPreview(URL.createObjectURL(f));
  });

  btnRetake.addEventListener("click", resetPhoto);
  queryEl.addEventListener("input", checkFormStatus);

  function submit(action){
    if(!blob || !queryEl.value.trim()) return;
    errorEl.style.display="none";
    btnIn.disabled=true; btnOut.disabled=true;
    statusEl.textContent = action==="in" ? "Clocking in..." : "Clocking out...";

    var fd=new FormData();
    fd.append("action", action);
    fd.append("query", queryEl.value.trim());
    fd.append("device_id", deviceId());
    fd.append("photo", blob, "attendance.jpg");

    fetch(CFG.url, {
      method:"POST",
      headers:{ "X-CSRFToken": CFG.csrf },
      body: fd,
      credentials:"same-origin"
    }).then(function(r){
      return r.json().catch(function(){return {};}).then(function(d){ return {ok:r.ok, data:d}; });
    }).then(function(r){
      if(r.ok && r.data.ok){
        statusEl.textContent = r.data.message;
        statusEl.style.color = "#059669";
        setTimeout(function(){
          statusEl.style.color = "";
          resetPhoto();
          queryEl.value="";
          checkFormStatus();
        }, 3000);
      } else {
        errorEl.textContent = r.data.error || "Could not record attendance.";
        errorEl.style.display="block";
        checkFormStatus();
      }
    }).catch(function(){
      errorEl.textContent = "Network error. Try again.";
      errorEl.style.display="block";
      checkFormStatus();
    });
  }

  btnIn.addEventListener("click", function(){ submit("in"); });
  btnOut.addEventListener("click", function(){ submit("out"); });

  resetPhoto();
  deviceId();
  tryLive();
})();
</script>
{% endblock %}
